<html lang="zh-Hant">

<style>
/* 版面：頂部固定篩選列＋分頁，下方為卡片式資料區；色彩以財報藍為主色，狀態色另立 */
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efec; --line: #dddcd6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #807f79;
  --accent: #1c5cab; --accent-soft: #e3eefb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-text: #006300; --crit-text: #b02a2a;
  --row-hl: #eef4fb; --sub: #e9eef5; --tot: #dfe8f1;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #383835;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #6da7ec; --accent-soft: #1d2b3d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --good-text: #4fcf4f; --crit-text: #ff8a8a;
    --row-hl: #1f2a37; --sub: #22262c; --tot: #263241;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #383835;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #6da7ec; --accent-soft: #1d2b3d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --good-text: #4fcf4f; --crit-text: #ff8a8a;
  --row-hl: #1f2a37; --sub: #22262c; --tot: #263241;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 14px 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border-radius: 999px; padding: 4px 14px; background: var(--surface-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.coa-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.coa-sum > div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.kv { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.pair { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.pair-h { font-weight: 600; }
.pair-n { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cgroups { display: grid; gap: 14px; margin-top: 14px; }
.cgroup { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gc); border-radius: 10px; padding: 12px 16px 6px; }
.cgroup-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: end; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.cgroup-h h3 { margin: 0; font-size: 15px; }
.cgroup-t { display: flex; gap: 14px; font-variant-numeric: tabular-nums; color: var(--text-2); }
.acc { display: grid; grid-template-columns: 82px minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.acc:last-child { border-bottom: 0; }
.acc-code { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--gc); font-weight: 600; padding-top: 2px; }
.acc-name { font-weight: 600; margin-bottom: 2px; }
.acc-tip { margin-top: 6px; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; color: var(--text-2); }
.acc-tip::before { content: "提醒｜"; font-weight: 600; color: var(--text); }
.acc-v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
.meter i { display: block; height: 100%; background: var(--gc); border-radius: 3px; }
.pl-note { white-space: normal; min-width: 240px; max-width: 340px; font-size: 12px; color: var(--text-2); line-height: 1.5; }
.pl-users { margin: 3px 0; }
.pl-users .tag { font-size: 11px; margin: 0 3px 2px 0; }
.tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.acc-items .tag { margin: 3px 4px 0 0; }
@media (max-width: 900px) { .acc { grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr); } .acc-main { grid-column: 2 / -1; } .acc-items { grid-column: 1 / -1; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100% - 32px)); background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 20; white-space: pre-line; }
select:disabled { opacity: .75; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; margin: 0; }
.brand .sub { color: var(--muted); font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; align-items: end; }
.filters label { display: flex; flex-direction: column; font-size: 11.5px; color: var(--text-2); gap: 3px; }
select, input, textarea, button { font: inherit; color: var(--text); }
select, input[type=text], input[type=number], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:hover { border-color: var(--accent); }
nav.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--text-2); white-space: nowrap; }
nav.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding-block: 18px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--text-2); margin-bottom: 14px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 14.5px; }
.card .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.kpi .lab { font-size: 12px; color: var(--text-2); }
.kpi .val { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .cmp { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chartbox { position: relative; height: 290px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { text-align: right; color: var(--text-2); font-weight: 500; background: var(--surface-2); position: sticky; top: 0; }
th.l, td.l { text-align: left; } td { text-align: right; }
tr.sec td { background: var(--sub); font-weight: 600; text-align: left; }
tr.tot td { background: var(--tot); font-weight: 600; }
tr:hover td { background: var(--row-hl); }
td.code { color: var(--muted); text-align: left; font-size: 12px; }
td.neg, span.neg { color: var(--crit-text); }
td.pos, span.pos { color: var(--good-text); }
td.est { color: var(--muted); font-style: italic; }
.wrap { white-space: normal; min-width: 220px; }
.ins { border-left: 4px solid var(--line); padding: 8px 12px; margin: 8px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.ins.critical { border-left-color: var(--crit); } .ins.warning { border-left-color: var(--warn); } .ins.good { border-left-color: var(--good); } .ins.info { border-left-color: var(--s1); }
.ins b { display: block; margin-bottom: 2px; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--text-2); margin-right: 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 10px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
textarea { width: 100%; min-height: 110px; }
.hidden { display: none !important; }
@media (max-width: 640px) { header, main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } .two { grid-template-columns: 1fr; } .kpi .val { font-size: 20px; } }
body.locked header, body.locked main { display: none; }
#loginBox { min-height: 100vh; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
#loginBox form { width: 100%; max-width: 360px; }
</style>

function anomalyScan(depts) {
  // 以欄位（月／期間）為樣本，找出費用突增：> 平均＋2 倍標準差 且 > 5 萬
  const cols = columns().filter(c => c.m.length === 1 || S.year === 2026), out = [];
  const series = cols.map(c => S.year === 2027 ? actual(depts, c.m) : actual(depts, c.m));
  COA.filter(c => c.sec === "opx" || c.sec === "cogs").forEach(c => {
    const vals = series.map(s => s[c.code] || 0); const nz = vals.filter(v => v);
    if (nz.length < 4) return;
    const mean = nz.reduce((a, b) => a + b, 0) / nz.length;
    const sd = Math.sqrt(nz.reduce((a, b) => a + (b - mean) * (b - mean), 0) / nz.length);
    vals.forEach((v, i) => { if (sd && v > mean + 2 * sd && v - mean > 50000) out.push({ code: c.code, name: c.name, col: cols[i].label, v, mean }); });
  });
  return out.sort((a, b) => (b.v - b.mean) - (a.v - a.mean));
}
function insights() {
  const depts = scopeDepts(), months = periodMonths(), out = [];
  const isCost = depts && depts.every(d => d === "營運處" || OPS_SUB.indexOf(d) >= 0);
  const A = actual(depts, months), T = totals(A);
  const push = (level, title, body) => out.push({ level, title, body });
  const hasAct = T.rev || T.opx || T.cogs;
  if (S.year === 2027) {
    const c = closed2027();
    const bm = months.filter(m => m <= c);
    const B = budget(depts, months), TB = totals(B);
    if (!c) push("info", "2027 尚無實際數字", "目前只顯示預算。每月結帳後到「資料管理」匯入會計損益表，系統會自動計算達成率、差異與全年預估。");
    else {
      const Bc = budget(depts, bm), TBc = totals(Bc), Ac = actual(depts, bm), TAc = totals(Ac);
      const ach = TBc.rev ? TAc.rev / TBc.rev : null;
      if (ach != null) push(ach >= 1 ? "good" : ach >= 0.95 ? "warning" : "critical", `營收達成率 ${pct(ach)}（截至 ${c} 月）`,
        `實際 ${fmt(TAc.rev)}，預算 ${fmt(TBc.rev)}，差異 ${sgn(TAc.rev - TBc.rev)}。` + (ach < 1 ? "建議檢視驅動因子（出租率、管理戶數、成交件數）是否低於預算假設。" : "可評估上修後續月份目標或提前投入成長資源。"));
      const full = budget(depts, M12), TF = totals(full), rest = budget(depts, M12.filter(m => m > c)), TR = totals(rest);
      const fc = TAc.pbt + TR.pbt;
      push(fc >= TF.pbt ? "good" : "warning", `全年稅前淨利預估 ${fmt(fc)}`, `＝實際（1-${c} 月）${fmt(TAc.pbt)}＋未來月份預算 ${fmt(TR.pbt)}；全年預算 ${fmt(TF.pbt)}，預估差異 ${sgn(fc - TF.pbt)}。`);
      const rows = COA.map(a => ({ a, b: Bc[a.code] || 0, v: Ac[a.code] || 0 })).filter(r => r.b || r.v)
        .map(r => Object.assign(r, { d: r.v - r.b })).filter(r => !favorable(r.a.sec, r.d) && Math.abs(r.d) >= Math.max(50000, Math.abs(r.b) * 0.1))
        .sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
      if (rows.length) push("warning", "不利差異前 " + rows.length + " 名科目", rows.map(r => `${r.a.code} ${r.a.name}：實際 ${fmt(r.v)}／預算 ${fmt(r.b)}（${sgn(r.d)}）`).join("<br>") + "<br>建議處長說明原因：一次性、時間差，或需調整後續預算。");

  NATURES.forEach(n => idx.forEach((i, k) => { if (!k) return; const p = idx[k - 1]; if (cols[i].m.length !== cols[p].m.length) return; const d = T[i]["n_" + n] - T[p]["n_" + n]; if (!jump || d > jump.d) jump = { n, i, d }; }));

AFTER.report = () => {
  const out = document.getElementById("beOut"); if (!out) return;
  const calc = () => {
    const rev0 = +out.dataset.rev, g0 = +out.dataset.gpm, opx0 = +out.dataset.opx, non = +out.dataset.non;
    const rev = rev0 * (1 + (+beR.value || 0) / 100), g = g0 + (+beG.value || 0) / 100, opx = opx0 * (1 + (+beO.value || 0) / 100);

    out.innerHTML = `<table style="max-width:640px"><tr><th class="l">項目</th><th>基準</th><th>試算</th></tr>

          ${canReply ? `<textarea data-reply="${esc(k)}" style="min-height:60px;margin-top:6px" placeholder="主管回覆">${esc(n.reply || "")}</textarea>` : (n.reply ? `<div class="ins info small"><b>主管回覆（${esc(n.replyBy || "")}）</b>${esc(n.reply)}</div>` : "")}</div>`;
      }).join("") + `</div></div>`;
    }).join("");
};
AFTER.notes = () => {
  main.querySelectorAll("textarea[data-note]:not([readonly])").forEach(t => t.addEventListener("change", () => saveNote(t.dataset.note, { text: t.value, by: role().name, byId: ME, at: new Date().toLocaleString("zh-TW") })));
  main.querySelectorAll("textarea[data-reply]").forEach(t => t.addEventListener("change", () => saveNote(t.dataset.reply, { reply: t.value, replyBy: role().name, replyById: ME })));
};

VIEWS.data = () => {
  if (!canManage()) return `<div class="card"><p class="muted">資料管理需要儀表板的「編輯者」權限。</p></div>`;
  const c = closed2027();
  return `<div class="grid two">
  <div class="card"><h3>匯入 2027 實際數字（會計月報）</h3><p class="hint">CSV 欄位：<b>月份, 部門, 會計科目代碼, 金額</b>（可多一欄「年度」）。部門用會計的五處：${ACC_DEPTS.join("、")}；若會計有細分營運中心，也可填 ${OPS_SUB.join("、")}。同一處、同一月份會整批覆蓋。收入、成本、費用都填正數；銷貨折讓 4120 填負數。</p>
    <div class="row"><button id="tplBtn">下載匯入範本</button><input type="file" id="actFile" accept=".csv"></div><div id="actMsg" class="small"></div>
    <p class="small muted">目前已匯入：${c ? "1-" + c + " 月，共 " + Object.keys(ACT2027).length + " 個處" : "尚無"}　<button id="actClear">清除 2027 實際數字</button></p></div>
  <div class="card"><h3>手動輸入 2027 實際數字</h3><p class="hint">選擇處與月份後，逐科目輸入。</p>
    <div class="row"><label>處<select id="mDept">${ALL_UNITS.map(d => `<option>${d}</option>`).join("")}</select></label><label>月份<select id="mMon">${M12.map(m => `<option value="${m}">${m} 月</option>`).join("")}</select></label><button id="mOpen" class="primary">開啟輸入表</button></div><div id="mBox"></div></div>
  <div class="card"><h3>更新 2027 預算</h3><p class="hint">預算系統（會計科目對照版）按「匯出 CSV」後，把產生的「…-會計科目版.csv」匯入這裡；系統依檔內「情境」欄更新 110M 或 120M。</p>
    <div class="row"><input type="file" id="budFile" accept=".csv"><button id="budReset">還原內建預算（2026/10/21 備份）</button></div><div id="budMsg" class="small"></div></div>
  ${ONLINE && ADMIN ? `<div class="card"><h3>角色指派</h3><p class="hint">搜尋公司成員並指定角色。處長只會看到自己的處；執行長、營運長看全部。對方也需要在分享選單被加入此頁面（建議設為「參與者」，才能填寫季度建議）。</p><input type="text" id="rq" placeholder="輸入姓名或 email 搜尋" style="width:100%;max-width:320px"><div id="rHits"></div><h3 style="margin-top:12px">已指派</h3><div id="rList"></div></div>` : ""}
  <div class="card"><h3>群組設定</h3><p class="hint">勾選每個群組包含的處。</p>
    <div class="tablewrap"><table><tr><th class="l">群組</th>${ALL_UNITS.map(d => `<th>${d}</th>`).join("")}</tr>${Object.keys(GROUPS).map(g => `<tr><td class="l">${g}</td>${ALL_UNITS.map(d => `<td><input type="checkbox" data-g="${g}" data-d="${d}" ${GROUPS[g].indexOf(d) >= 0 ? "checked" : ""}></td>`).join("")}</tr>`).join("")}</table></div>
    <p class="small muted">管理、資訊、財務、投資、公關五處在會計帳屬於「營運處」：勾「營運處」即包含五處；單獨勾子處時，2026 實績沒有子處資料，只看得到 2027 預算（與匯入時標註子處的實際數字）。</p>
    <div class="row" style="margin-top:8px"><button id="grpReset">恢復預設</button></div></div>
  <div class="card"><h3>備份與還原</h3><p class="hint">一次匯出／匯入：2027 實際數字、更新過的預算、季度建議、群組設定。</p>
    <div class="row"><button id="expAll">匯出全部資料（JSON）</button><input type="file" id="impAll" accept=".json"></div></div>
  <div class="card"><h3>資料說明</h3><ul class="small">
    ${window.DATA_NOTES_HTML || ""}
  </ul></div></div>`;
};
function parseCsv(text) {
  return text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim()).map(l => { const o = []; let cur = "", q = false;
    for (let i = 0; i < l.length; i++) { const ch = l[i]; if (q) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === ",") { o.push(cur); cur = ""; } else cur += ch; }
    o.push(cur); return o.map(x => x.trim()); });
}
const readFile = (input, cb) => { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(String(r.result), f.name); r.readAsText(f, "utf-8"); input.value = ""; };
AFTER.data = () => {
  if (!canManage()) return;
  tplBtn.onclick = () => download("2027實際數字匯入範本.csv", "﻿年度,月份,部門,會計科目代碼,金額\n2027,1,短租處,4101-01,0\n2027,1,短租處,5990-01,0\n2027,1,營運處,6020,0\n", "text/csv;charset=utf-8");
  actFile.onchange = () => readFile(actFile, async text => {
    const rows = parseCsv(text), h = rows[0], ix = k => h.findIndex(x => x.indexOf(k) >= 0);
    const I = { m: ix("月"), d: ix("部門"), c: ix("代碼"), v: ix("金額"), y: ix("年度") };
    if (I.m < 0 || I.d < 0 || I.c < 0 || I.v < 0) { flash("欄位不符，請使用匯入範本（月份, 部門, 會計科目代碼, 金額）。"); return; }
    const bad = [], seen = {}, next = JSON.parse(JSON.stringify(ACT2027)); let ok = 0;
    rows.slice(1).forEach((r, i) => {
      const m = +r[I.m], d = r[I.d], c = r[I.c], v = +String(r[I.v]).replace(/[,\s]/g, "").replace(/^\((.*)\)$/, "-$1");
      if (I.y >= 0 && r[I.y] && +r[I.y] !== 2027 && +r[I.y] !== 116) return;
      if (!(m >= 1 && m <= 12) || ALL_UNITS.indexOf(d) < 0 || !COA_BY[c] || isNaN(v)) { bad.push(i + 2); return; }
      const k = d + "|" + m; if (!seen[k]) { seen[k] = 1; Object.keys(next[d] || {}).forEach(cc => { next[d][cc][m - 1] = 0; }); }
      next[d] = next[d] || {}; next[d][c] = next[d][c] || Array(12).fill(0); next[d][c][m - 1] += v; ok++;
    });
    if (!ok) { flash("沒有可匯入的資料列。" + (bad.length ? `略過 ${bad.length} 列（月份、部門或會計科目代碼不正確）。` : "")); return; }
    if (await persist("act2027", next)) {
      ACT2027 = next;
      flash(`已匯入 ${ok} 筆（${Object.keys(seen).length} 個處×月）。` + (bad.length ? `\n略過 ${bad.length} 列（第 ${bad.slice(0, 10).join("、")}${bad.length > 10 ? "…" : ""} 列：月份、部門或會計科目代碼不正確）。` : ""));
      render();
    }
  });
  confirmBtn(actClear, actClear.textContent, async () => { if (await persist("act2027", {})) { ACT2027 = {}; flash("已清除 2027 實際數字。"); render(); } });
  mOpen.onclick = () => {
    const d = mDept.value, m = +mMon.value, h = ACT2027[d] || {}, bm = budget([d], [m]);
    mBox.innerHTML = `<div class="tablewrap" style="max-height:380px;overflow:auto"><table><tr><th class="l">代碼</th><th class="l">科目</th><th>${m} 月預算</th><th>實際</th></tr>` +
      COA.map(a => `<tr><td class="code">${a.code}</td><td class="l">${a.name}</td><td>${fmt(bm[a.code] || 0)}</td><td><input type="number" id="mc-${a.code}" data-mc="${a.code}" value="${(h[a.code] || [])[m - 1] || ""}" style="width:120px"></td></tr>`).join("") +
      `</table></div><div class="row" style="margin-top:8px"><button id="mSave" class="primary">儲存 ${d} ${m} 月</button></div>`;
    mSave.onclick = async () => {
      const next = JSON.parse(JSON.stringify(ACT2027)); next[d] = next[d] || {};
      mBox.querySelectorAll("input[data-mc]").forEach(inp => { const c = inp.dataset.mc, v = +inp.value || 0; if (!next[d][c]) { if (!v) return; next[d][c] = Array(12).fill(0); } next[d][c][m - 1] = v; });
      if (await persist("act2027", next)) { ACT2027 = next; flash(`已儲存 ${d} ${m} 月實際數字。`); render(); }
    };
  };
  budFile.onchange = () => readFile(budFile, async text => {
    const rows = parseCsv(text), h = rows[0], ix = k => h.indexOf(k);
    const I = { s: ix("情境"), d: ix("部門"), c: ix("會計科目代碼"), m1: ix("1月") };
    if (I.s < 0 || I.d < 0 || I.c < 0 || I.m1 < 0) { flash("格式不符：請用預算系統（會計科目對照版）匯出的 CSV。"); return; }
    const nb = {}; let skip = 0;
    rows.slice(1).forEach(r => { const s = r[I.s], d = r[I.d], c = r[I.c]; if (!COA_BY[c]) { skip++; return; }
      nb[s] = nb[s] || {}; nb[s][d] = nb[s][d] || {}; nb[s][d][c] = nb[s][d][c] || Array(12).fill(0);
      for (let k = 0; k < 12; k++) nb[s][d][c][k] += +String(r[I.m1 + k]).replace(/,/g, "") || 0; });
    const merged = Object.assign({}, BUD, nb);
    if (await persist("bud", merged)) { BUD = merged; flash("已更新預算情境：" + Object.keys(nb).join("、") + (skip ? `\n有 ${skip} 列沒有有效會計科目代碼，未計入（請回預算系統「科目維護」補上）。` : "")); render(); }
  });
  confirmBtn(budReset, budReset.textContent, async () => { if (await persist("bud", null)) { BUD = BUD2027; flash("已還原內建預算。"); render(); } });
  main.querySelectorAll("input[data-g]").forEach(cb => cb.onchange = async () => {
    const g = cb.dataset.g, d = cb.dataset.d, next = JSON.parse(JSON.stringify(GROUPS));
    next[g] = ALL_UNITS.filter(x => x === d ? cb.checked : next[g].indexOf(x) >= 0);
    if (await persist("groups", next)) { GROUPS = next; render(); } else cb.checked = !cb.checked;
  });
  grpReset.onclick = async () => { const next = JSON.parse(JSON.stringify(DEFAULT_GROUPS)); if (await persist("groups", next)) { GROUPS = next; render(); } };
  expAll.onclick = () => download("全居儀表板資料備份-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify({ v: 1, act2027: ACT2027, bud: BUD === BUD2027 ? null : BUD, notes: NOTES, groups: GROUPS }, null, 1), "application/json");
  impAll.onchange = () => readFile(impAll, async text => {
    let d; try { d = JSON.parse(text); if (d.v !== 1) throw 0; } catch (e) { flash("檔案格式不符：請選擇本儀表板匯出的 JSON 備份。"); return; }
    await persist("act2027", d.act2027 || {}); await persist("bud", d.bud || null); await persist("groups", d.groups || GROUPS);
    for (const k of Object.keys(d.notes || {})) await saveNote(k, d.notes[k]);
    ACT2027 = d.act2027 || {}; BUD = d.bud || BUD2027; GROUPS = d.groups || GROUPS; flash("已還原備份。"); render();
  });
  // 角色指派（線上、編輯者）
  if (ONLINE && ADMIN && document.getElementById("rq")) {
    const draw = async () => {
      const ids = Object.keys(ROLEMAP), ps = ids.length && USR ? await USR.profiles(ids) : {};
      rList.innerHTML = ids.length ? `<table><tr><th class="l">人員</th><th class="l">角色</th><th></th></tr>` + ids.map(id => `<tr><td class="l" data-name="${esc(id)}"></td><td class="l"><select data-rid="${esc(id)}">${ROLES.map(r => `<option value="${r.id}" ${ROLEMAP[id] === r.id ? "selected" : ""}>${r.name}</option>`).join("")}</select></td><td><button data-rdel="${esc(id)}">移除</button></td></tr>`).join("") + `</table>` : `<p class="muted small">尚未指派任何人。沒被指派的人打開頁面時，只會看到「尚未指派角色」。</p>`;
      rList.querySelectorAll("[data-name]").forEach(td => { td.textContent = (ps[td.dataset.name] || {}).name || "（無法顯示姓名的成員）"; });
      rList.querySelectorAll("select[data-rid]").forEach(s => s.onchange = () => setRole(s.dataset.rid, s.value));
      rList.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => setRole(b.dataset.rdel, null));
    };
    const setRole = async (id, rid) => { const next = Object.assign({}, ROLEMAP); if (rid) next[id] = rid; else delete next[id]; if (await persist("roles", next)) { ROLEMAP = next; draw(); } };
    const search = async q => {
      const hits = USR ? await USR.search(q) : [];
      rHits.innerHTML = "";
      hits.forEach(h => {
        const row = document.createElement("div"); row.className = "row"; row.style.margin = "4px 0";
        const nm = document.createElement("span"); nm.textContent = h.name; nm.style.minWidth = "140px";
        const sel = document.createElement("select"); sel.id = "rs-" + h.id; sel.innerHTML = ROLES.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
        if (ROLEMAP[h.id]) sel.value = ROLEMAP[h.id];
        const btn = document.createElement("button"); btn.textContent = ROLEMAP[h.id] ? "更新角色" : "指派"; btn.className = "primary";
        btn.onclick = () => setRole(h.id, sel.value);
        row.append(nm, sel, btn); rHits.append(row);
      });
      if (!hits.length && q) rHits.innerHTML = `<p class="muted small">找不到符合的成員。</p>`;
    };
    rq.addEventListener("focus", () => search(rq.value));
    rq.addEventListener("input", () => search(rq.value));
    draw();
  }
};

render();
initOnline();
</script>
<script>
(async () => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keyFrom = async pw => {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  };
  const unlock = async key => {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
    const d = JSON.parse(new TextDecoder().decode(pt));
    window.ACT2026 = d.ACT2026; window.BUD2027 = d.BUD2027; window.BUDITEMS = d.BUDITEMS; window.DATA_NOTES_HTML = d.DATA_NOTES_HTML;
    document.body.classList.remove("locked"); loginBox.remove();
    const s = document.createElement("script"); s.textContent = document.getElementById("appsrc").textContent; document.body.appendChild(s);
    const out = document.createElement("button"); out.textContent = "登出"; out.style.marginLeft = "auto";
    out.onclick = () => { try { sessionStorage.removeItem("qj-key"); } catch (e) {} location.reload(); };
    document.querySelector(".brand").appendChild(out);
  };
  try {
    const raw = sessionStorage.getItem("qj-key");
    if (raw) { await unlock(await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"])); return; }
  } catch (e) { try { sessionStorage.removeItem("qj-key"); } catch (_) {} }
  loginPw.focus();
  loginForm.addEventListener("submit", async e => {
    e.preventDefault(); loginBtn.disabled = true; loginMsg.textContent = "驗證中…";
    let key;
    try { key = await keyFrom(loginPw.value); await unlock(key); }
    catch (err) { loginMsg.textContent = "密碼不正確，請再試一次。"; loginBtn.disabled = false; loginPw.select(); return; }
    try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); sessionStorage.setItem("qj-key", btoa(String.fromCharCode.apply(null, raw))); } catch (e) {}
  });
})();
</script>
